buildscript {
    repositories {
        jcenter()
    }

    dependencies {
        classpath "org.robolectric:robolectric-gradle-plugin:0.14.0"
        classpath "com.android.tools.build:gradle:1.0.0"
        classpath "org.kt3k.gradle.plugin:coveralls-gradle-plugin:2.0.1"
    }
}

subprojects { project ->
    repositories {
        jcenter()
    }

    // JitPack publishes multi-module builds under com.github.<user>.<repo>.
    // When the build is not running on JitPack, keep the project's original
    // coordinates so normal dev builds and Sonatype releases are unchanged.
    if (System.getenv('JITPACK') == 'true') {
        version = System.getenv('VERSION') ?: rootProject.VERSION_NAME
        group = "${System.getenv('GROUP')}.${System.getenv('ARTIFACT')}"
    } else {
        version = rootProject.VERSION_NAME
        group = rootProject.GROUP
    }

    // The Android tools bundled with this old build (dx from build-tools 19)
    // cannot read Java 8 class files. Keep the whole build on Java 6 bytecode.
    tasks.withType(JavaCompile) {
        sourceCompatibility = '1.6'
        targetCompatibility = '1.6'
    }

    apply plugin: 'checkstyle'

    checkstyle {
        configFile = new File(rootDir, 'checkstyle.xml')
        configProperties.checkStyleConfigDir = rootProject.rootDir
    }

    task checkstyle(type: Checkstyle) {
        source 'src'
        include '**/*.java'
        exclude '**/gen/**'

        // empty classpath
        classpath = files()
    }

    afterEvaluate {
        if (project.tasks.findByName('check')) {
            check.dependsOn('checkstyle')
        }
    }

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            if (!name.contains('Test')) {
                options.compilerArgs << '-Xlint:unchecked' << '-Xlint:deprecation'
            }
        }
    }
}

// Modules that make up the published Glide artifacts. The third party
// projects live beside a git submodule, so wire their publishing up here
// rather than editing the submodule's build file.
[
        ':library',
        ':glide',
        ':third_party:disklrucache',
        ':third_party:gif_decoder',
        ':third_party:gif_encoder'
].each { projectPath ->
    project(projectPath).afterEvaluate { publishProject ->
        if (publishProject.plugins.hasPlugin('com.android.library')) {
            publishProject.apply from: new File(rootDir, 'scripts/publish-android.gradle')
        } else if (publishProject.plugins.hasPlugin('java')) {
            publishProject.apply from: new File(rootDir, 'scripts/publish-java.gradle')
        }
    }
}
task wrapper(type: Wrapper) {
    gradleVersion = '2.2'
}