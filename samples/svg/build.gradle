apply plugin: 'com.android.application'

repositories {
    mavenCentral()
}

android {
    compileSdkVersion COMPILE_SDK_VERSION as int
    buildToolsVersion BUILD_TOOLS_VERSION as String

    defaultConfig {
        applicationId 'com.bumptech.glide.samples.svg'
        minSdkVersion MIN_SDK_VERSION as int
        targetSdkVersion TARGET_SDK_VERSION as int

        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    compile project(':library')
    compile 'com.caverock:androidsvg:1.2.1'
    // Glide's with(...) overloads reference support-v4 types, so it must be on the compile
    // classpath even though the library no longer pulls it in transitively.
    compile "com.android.support:support-v4:${SUPPORT_V4_VERSION}"
}

task run(type: Exec, dependsOn: 'installDebug') {
    description 'Installs the APK and runs the main activity: "gradlew :samples:???:run"'
    commandLine "${android.sdkDirectory}/platform-tools/adb", 'shell', 'am', 'start', '-n', 'com.bumptech.glide.samples.svg/.MainActivity'
}
